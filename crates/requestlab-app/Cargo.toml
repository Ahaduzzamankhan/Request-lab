[package]
name = "requestlab-app"
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "requestlab"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
ely-gpui-component = { workspace = true }
requestlab-ui = { workspace = true }
requestlab-core = { workspace = true }
requestlab-cli = { workspace = true }
requestlab-updater = { workspace = true }
requestlab-models = { workspace = true }
requestlab-storage = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[build-dependencies]
# Compiles the Windows icon/version resource; a no-op on other hosts.
embed-resource = "3"
