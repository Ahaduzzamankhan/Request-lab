name: Dependency audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # `.cargo/audit.toml` holds advisory ids that cannot be fixed while the
        # UI and database stacks stay pinned, each with the reason and what would
        # allow the entry to be removed. Anything outside that list still fails.
        run: cargo audit --deny warnings
