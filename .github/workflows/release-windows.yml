name: Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without creating a tag or release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-version.sh
          version="$(python -c "import json;print(json.load(open('version.json'))['version'])")"
          channel="$(python -c "import json;print(json.load(open('version.json'))['channel'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify the version is not already released
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "::error::tag $tag already exists - bump version.json before releasing"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists - bump version.json before releasing"
            exit 1
          fi
          echo "version $tag is unreleased"

      - name: Require the release signing key
        shell: bash
        env:
          REQUESTLAB_SIGNING_KEY: ${{ secrets.REQUESTLAB_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REQUESTLAB_SIGNING_KEY:-}" ]; then
            echo "::error::REQUESTLAB_SIGNING_KEY is not set. Add the release signing seed as a repository secret; every published build must be signed because the application refuses unsigned manifests."
            exit 1
          fi

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p requestlab-models -p requestlab-http -p requestlab-storage \
                     -p requestlab-collections -p requestlab-environments \
                     -p requestlab-core -p requestlab-cli -p requestlab-manager \
                     -p requestlab-manager-ui -p requestlab-update-helper \
                     -p requestlab-installer -p requestlab-updater
          cargo build --workspace --all-targets

      # The update helper is built first so the application can embed the public
      # key that verifies this release. The seed itself is never printed.
      - name: Build the update helper
        run: cargo build --release -p requestlab-update-helper

      - name: Derive the release public key
        shell: bash
        env:
          REQUESTLAB_SIGNING_KEY: ${{ secrets.REQUESTLAB_SIGNING_KEY }}
        run: |
          set -euo pipefail
          public_key="$(./target/release/requestlab-update-helper.exe public-key)"
          if [ -z "$public_key" ]; then
            echo "::error::could not derive the release public key from the signing seed"
            exit 1
          fi
          echo "REQUESTLAB_MANIFEST_PUBLIC_KEY=$public_key" >> "$GITHUB_ENV"

      - name: Build the signed application
        run: |
          cargo build --release -p requestlab-app -p requestlab-cli -p requestlab-installer -p requestlab-updater

      - name: Verify every executable starts
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/requestlab.exe --version
          ./target/release/requestlab.exe --help | head -n 3
          ./target/release/requestlab-cli.exe --version
          ./target/release/requestlab-installer.exe --version
          ./target/release/requestlab-updater.exe --version
          ./target/release/requestlab-update-helper.exe --version

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/requestlab.exe dist/
          cp target/release/requestlab-cli.exe dist/
          cp target/release/requestlab-installer.exe dist/
          cp target/release/requestlab-updater.exe dist/
          cp target/release/requestlab-update-helper.exe dist/
          cp README.md LICENSE version.json dist/
          cd dist
          sha256sum requestlab.exe requestlab-cli.exe requestlab-installer.exe \
                    requestlab-updater.exe requestlab-update-helper.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Package the single-file download
        shell: pwsh
        run: |
          # The manifest names this file, so the name is fixed. It carries the
          # desktop application (which is also the CLI), the installer, the
          # updater and the helper.
          $name = "requestlab-windows-x86_64.zip"
          Compress-Archive -Path dist/requestlab.exe, dist/requestlab-cli.exe, `
              dist/requestlab-installer.exe, dist/requestlab-updater.exe, `
              dist/requestlab-update-helper.exe, README.md, LICENSE, version.json `
              -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path dist/SHA256SUMS.txt -Value "$hash  $name"
          Get-Content dist/SHA256SUMS.txt

      - name: Build and sign the release manifest
        shell: bash
        env:
          REQUESTLAB_SIGNING_KEY: ${{ secrets.REQUESTLAB_SIGNING_KEY }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          helper=./target/release/requestlab-update-helper.exe
          "$helper" build-manifest \
            --dist dist \
            --version-for "${{ steps.version.outputs.version }}" \
            --channel "${{ steps.version.outputs.channel }}" \
            --notes-url "https://github.com/${{ github.repository }}/releases/tag/$tag" \
            --out dist/manifest.json
          "$helper" sign-manifest --manifest dist/manifest.json --out dist/manifest.json.sig
          sha256sum dist/manifest.json dist/manifest.json.sig >> dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: requestlab-windows-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Create tag
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "RequestLab ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RequestLab ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ steps.version.outputs.channel != 'stable' }}
          generate_release_notes: true
          files: |
            dist/requestlab.exe
            dist/requestlab-cli.exe
            dist/requestlab-installer.exe
            dist/requestlab-updater.exe
            dist/requestlab-update-helper.exe
            dist/requestlab-windows-x86_64.zip
            dist/manifest.json
            dist/manifest.json.sig
            dist/SHA256SUMS.txt
