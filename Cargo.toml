[workspace]
resolver = "2"
members = [
    "crates/requestlab-models",
    "crates/requestlab-http",
    "crates/requestlab-storage",
    "crates/requestlab-collections",
    "crates/requestlab-environments",
    "crates/requestlab-core",
    "crates/requestlab-ui",
    "crates/requestlab-app",
    "crates/requestlab-cli",
    "crates/requestlab-manager",
    "crates/requestlab-manager-ui",
    "crates/requestlab-updater",
    "crates/requestlab-update-helper",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Shared runtime / serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
chrono = { version = "0.4.41", features = ["serde", "clock"] }
thiserror = "2.0.12"
anyhow = "1.0.98"
url = "2.5.4"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# Async runtime & networking
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "json", "charset", "http2", "stream"] }

# Distribution: release manifests, signatures, downloads, archives
sha2 = "0.10.9"
base64 = "0.22.1"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3.20.0"

# Windows-only: console reattachment and registry access
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem"] }

# Persistence
sqlx = { version = "0.8.5", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Desktop UI: Zed's GPUI snapshot published as `gpui-pre` 0.3.8. Ely's component
# library is built against exactly this version, so both share one app context.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
ely-gpui-component = { git = "https://github.com/ZacharyZhang-NY/Ely-GPUI-Components" }

# Internal crates
requestlab-models = { path = "crates/requestlab-models" }
requestlab-http = { path = "crates/requestlab-http" }
requestlab-storage = { path = "crates/requestlab-storage" }
requestlab-collections = { path = "crates/requestlab-collections" }
requestlab-environments = { path = "crates/requestlab-environments" }
requestlab-core = { path = "crates/requestlab-core" }
requestlab-ui = { path = "crates/requestlab-ui" }
requestlab-cli = { path = "crates/requestlab-cli", version = "0.1.3" }
requestlab-manager-ui = { path = "crates/requestlab-manager-ui" }
requestlab-manager = { path = "crates/requestlab-manager" }
requestlab-updater = { path = "crates/requestlab-updater" }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
